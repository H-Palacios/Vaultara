<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Vaultara</title>
<link rel="stylesheet" href="/share/style.css">
</head>
<body>
<div class="card">
<p id="loading"></p>
<div id="record" hidden>
<p class="eyebrow" id="sharedWith"></p>
<h1 id="name"></h1>
<p class="label" id="expiryLabel"></p>
<div class="date" id="expiry"></div>
<div class="images" id="images"></div>
<p class="note" id="linkExpires"></p>
</div>
<div id="expired" hidden>
<h1 id="expiredTitle"></h1>
<p id="expiredBody"></p>
</div>
<div id="error" hidden>
<h1 id="errorTitle"></h1>
<p id="errorBody"></p>
<button id="retry"></button>
</div>
</div>
<script src="/share/app.js" defer></script>
</body>
</html>
