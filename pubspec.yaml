name: vaultara
description: "A smart global expiry tracker for important documents."
publish_to: 'none'
version: 0.8.0+47

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter
  android_intent_plus: ^5.3.0

  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  firebase_core: ^3.6.0
  firebase_auth: ^5.2.0
  cloud_firestore: ^5.4.4
  firebase_storage: ^12.1.0
  cloud_functions: ^5.0.0
  firebase_app_check: ^0.3.2
  firebase_messaging: ^15.1.3

  flutter_tts: ^4.0.0

  local_auth: ^2.1.0
  shared_preferences: ^2.2.2

  url_launcher: ^6.3.0
  app_links: ^6.1.1

  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  in_app_purchase: ^3.3.0
  in_app_purchase_android: ^0.5.0
  in_app_purchase_storekit: ^0.4.0
  firebase_analytics: ^11.6.0

  google_mlkit_text_recognition: ^0.14.0
  google_mlkit_barcode_scanning: ^0.13.0
  image_picker: ^1.1.2
  home_widget: ^0.7.0
  share_plus: ^10.1.4
  qr_flutter: ^4.1.0
  pdf: ^3.11.1
  printing: ^5.13.4
  path_provider: ^2.1.5
  crypto: ^3.0.6
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.2
  flutter_secure_storage: ^10.0.0
  device_info_plus: ^11.3.0
  package_info_plus: ^8.3.0
  image: ^4.2.0
  quick_actions: ^1.1.0
  file_picker: ^10.3.3
  csv: ^6.0.0
  speech_to_text: ^7.0.0
  receive_sharing_intent: ^1.8.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/images/

l10n:
  arb-dir: lib/l10n
  template-arb-file: app_en.arb
  output-localization-file: app_localizations.dart

flutter_launcher_icons:
  android: true
  ios: true
  remove_alpha_ios: true
  image_path: assets/images/app_logo.png
  adaptive_icon_background: "#10162E"
  adaptive_icon_foreground: assets/images/app_logo_padded.png

flutter_native_splash:
  color: "#10162E"
  image: assets/images/app_logo_padded.png
  android_12:
    color: "#10162E"
    image: assets/images/app_logo_padded.png
